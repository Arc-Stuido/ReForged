plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    // oj mappings
    mappings channel: mapping_channel, version: mapping_version

    // Disabled reobf
    reobf = false

    // Enabled copyIdeResources
    copyIdeResources = true

    // accessTransformer file
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            // logging
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            environment 'MOD_CLASSES', "${mod_id}%%${layout.buildDirectory.dir('sourcesSets/main').get().asFile.absolutePath}"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven {
        name = "Modrinth"
        url "https://api.modrinth.com/maven"
    }
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ModLauncher early transformation service API
    compileOnly 'net.minecraftforge:modlauncher:10.2.1'

    // asm
    compileOnly 'org.ow2.asm:asm:9.7'
    compileOnly 'org.ow2.asm:asm-commons:9.7'
    compileOnly 'org.ow2.asm:asm-tree:9.7'
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // Mixin
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // MixinExtras — NeoForge 20.2.84+ bundles it, Forge does not. NeoForge mod
    // mixins (@WrapOperation etc.) need it on the classpath; the forge artifact
    // self-initializes through its IMixinConnector service.
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.4'

    // jopt-simple
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    // ── Test Mods (Forge) ──────────────────────────────────
    runtimeOnly "maven.modrinth:jei:rsCHKGSa"                              // JEI — Forge reference

    // ── Test Mods (NeoForge) ───────────────────────────────
    // Each mod exercises different NeoForge API surfaces:
    //   Jade        → Events, Capabilities, Network, Client extensions
    //   Waystones   → Registries, Network payloads, Data attachments, Config
    //   Balm        → Abstraction layer lib, Registries, Events, Network
    compileOnly "maven.modrinth:balm:21.0.41+neoforge-1.21.1"            // Compile against Balm API; do not bundle classes
    runtimeOnly "maven.modrinth:jade:15.10.5+neoforge"                     // Jade — tooltip overlay
    runtimeOnly "maven.modrinth:waystones:21.1.19+neoforge-1.21.1"        // Waystones — teleport
    runtimeOnly "maven.modrinth:balm:21.0.41+neoforge-1.21.1"             // Balm — Waystones dep (>= 21.0.39 required)
    runtimeOnly "maven.modrinth:create:n7NADxiG"                           // Create — kinetics & automation
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "reforged.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('patchNeoForgeMods', JavaExec) {
    group = 'reforged'
    description = 'Injects Forge discovery metadata into NeoForge jars in run/mods before launching.'
    dependsOn tasks.named('classes')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.xiyu.reforged.core.NeoForgeModPatcher'
    args layout.projectDirectory.dir('run/mods').asFile.absolutePath
}

tasks.register('copyReForgedDevMod', Copy) {
    group = 'reforged'
    description = 'Copies the current ReForged jar into run/mods so Forge userdev discovers it consistently.'
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into layout.projectDirectory.dir('run/mods')
    rename { "${mod_id}-dev.jar" }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn tasks.named('copyReForgedDevMod')
    dependsOn tasks.named('patchNeoForgeMods')
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
